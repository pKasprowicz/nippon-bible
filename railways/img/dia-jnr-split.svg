<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 354" width="1000" height="354" role="img" aria-labelledby="t d"><title id="t">The division of JNR in 1987</title><desc id="d">In April 1987 JNR, with debts of 37.1 trillion yen, was split into six regional passenger companies (Hokkaidō, East, Central, West, Shikoku and Kyūshū), one nationwide freight company and a settlement corporation. The Honshū companies, JR Freight and the Shinkansen holding corporation took 11.6 trillion yen of debt; the three island companies took none and received stabilisation funds; 25.5 trillion yen went to the settlement corporation.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="354" fill="#fff"/><text x="500.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">April 1987: Japanese National Railways is split up</text><rect x="380" y="52" width="240" height="64" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="500" y="78" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">JNR (1949–1987)</text><text x="500" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">debt ¥37.1 trillion</text><rect x="30" y="180" width="110" height="56" rx="8" fill="#fbe7e2" stroke="#b8412f" stroke-width="2"/><text x="85" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#b8412f">JR Hokkaidō</text><line x1="500" y1="118" x2="85" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="148" y="180" width="110" height="56" rx="8" fill="#e4ecf7" stroke="#2d5f9a" stroke-width="2"/><text x="203" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#2d5f9a">JR East</text><line x1="500" y1="118" x2="203" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="266" y="180" width="110" height="56" rx="8" fill="#e4ecf7" stroke="#2d5f9a" stroke-width="2"/><text x="321" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#2d5f9a">JR Central</text><line x1="500" y1="118" x2="321" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="384" y="180" width="110" height="56" rx="8" fill="#e4ecf7" stroke="#2d5f9a" stroke-width="2"/><text x="439" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#2d5f9a">JR West</text><line x1="500" y1="118" x2="439" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="502" y="180" width="110" height="56" rx="8" fill="#fbe7e2" stroke="#b8412f" stroke-width="2"/><text x="557" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#b8412f">JR Shikoku</text><line x1="500" y1="118" x2="557" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="620" y="180" width="110" height="56" rx="8" fill="#fbe7e2" stroke="#b8412f" stroke-width="2"/><text x="675" y="213" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#b8412f">JR Kyūshū</text><line x1="500" y1="118" x2="675" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><text x="384" y="253" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">six passenger companies</text><rect x="745" y="180" width="115" height="56" rx="8" fill="#fff" stroke="#222" stroke-width="2"/><text x="802" y="204" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:700" fill="#222">JR Freight</text><text x="802" y="220" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:700" fill="#222">one, nationwide</text><line x1="500" y1="118" x2="802" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="872" y="180" width="110" height="56" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="927" y="204" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:700" fill="#555">Settlement</text><text x="927" y="220" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:700" fill="#555">Corporation</text><line x1="500" y1="118" x2="927" y2="178" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30" y="266" width="590" height="70" rx="8" fill="#e4ecf7" stroke="#2d5f9a" stroke-width="2" stroke-dasharray="6 5"/><text x="325" y="290" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">Honshū companies + JR Freight + Shinkansen Holding Corp.: ¥11.6 trillion of debt</text><text x="325" y="310" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">Hokkaidō, Shikoku, Kyūshū: no debt, but ¥1.3 trillion stabilisation funds</text><rect x="640" y="266" width="342" height="70" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2" stroke-dasharray="6 5"/><text x="811" y="290" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">¥25.5 trillion, to be repaid by</text><text x="811" y="310" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">selling land and JR shares</text></svg>