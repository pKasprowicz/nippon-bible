<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d"><title id="t">Carbon dioxide per tonne-kilometre</title><desc id="d">In fiscal 2023 a commercial truck emitted 207 g of CO2 per tonne-kilometre, a coastal ship 42 g and a freight train 19 g, about one eleventh of the truck. One freight train carries up to 650 tonnes, the load of 65 ten-tonne trucks.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="260" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#222">CO₂ to carry one tonne one kilometre (fiscal 2023)</text><text x="180" y="89" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">commercial truck</text><rect x="195" y="62" width="455.40000000000003" height="38" rx="6" fill="#888"/><text x="660.4000000000001" y="88" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">207 g</text><text x="180" y="145" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">coastal ship</text><rect x="195" y="118" width="92.4" height="38" rx="6" fill="#2d5f9a"/><text x="297.4" y="144" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">42 g</text><text x="180" y="201" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">freight train</text><rect x="195" y="174" width="41.800000000000004" height="38" rx="6" fill="#b8412f"/><text x="246.8" y="200" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">19 g</text><text x="380.0" y="242" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#555">One freight train carries up to 650 tonnes: 65 ten-tonne trucks.</text></svg>