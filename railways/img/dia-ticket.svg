<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d"><title id="t">The parts of a JR fare</title><desc id="d">A limited express or Shinkansen journey needs a basic fare ticket (乗車券), charged by distance, plus a limited express ticket (特急券) for a reserved or non-reserved seat, plus optionally a Green car or sleeper ticket. Local and rapid trains need only the basic fare ticket. Children aged 6 to 11 pay half, except for Green and sleeper charges.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="250" fill="#fff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">What you pay for a JR limited express or Shinkansen</text><rect x="30" y="60" width="260" height="120" rx="12" fill="#e4ecf7" stroke="#2d5f9a" stroke-width="2"/><text x="160" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#2d5f9a">乗車券</text><text x="160" y="128" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">basic fare ticket</text><text x="160" y="154" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">by distance: always needed</text><text x="310" y="128" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:30px;font-weight:700" fill="#555">+</text><rect x="330" y="60" width="260" height="120" rx="12" fill="#fbe7e2" stroke="#b8412f" stroke-width="2"/><text x="460" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#b8412f">特急券</text><text x="460" y="128" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">limited express ticket</text><text x="460" y="154" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">reserved or non-reserved seat</text><text x="610" y="128" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:30px;font-weight:700" fill="#555">+</text><rect x="630" y="60" width="260" height="120" rx="12" fill="#fff" stroke="#222" stroke-width="2"/><text x="760" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#222">グリーン券 / 寝台券</text><text x="760" y="128" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Green car / sleeper</text><text x="760" y="154" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">optional upgrade</text><text x="450.0" y="212.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Local and rapid trains need only the basic fare ticket.</text><text x="450.0" y="230.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Children aged 6 to 11 pay half, but Green and sleeper charges are the same as for adults.</text></svg>