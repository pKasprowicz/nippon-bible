<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Share of JR lines with low traffic</title><desc id="d">The share of JR passenger companies’ route length with a traffic density below 2,000 passengers per day rose from 16 per cent in fiscal 1987 to 31 per cent in fiscal 2019 and 38 per cent in fiscal 2020.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="330" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#222">JR passenger lines carrying fewer than 2,000 people a day</text><text x="380.0" y="52" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">(share of route length; “density” = average passengers per km per day)</text><rect x="150" y="206.4" width="110" height="73.6" rx="6" fill="#2d5f9a"/><text x="205" y="196.4" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#2d5f9a">16%</text><text x="205" y="304" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">FY1987</text><rect x="350" y="137.4" width="110" height="142.6" rx="6" fill="#b8412f"/><text x="405" y="127.4" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#b8412f">31%</text><text x="405" y="304" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">FY2019</text><rect x="550" y="105.20000000000002" width="110" height="174.79999999999998" rx="6" fill="#b8412f"/><text x="605" y="95.20000000000002" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#b8412f">38%</text><text x="605" y="304" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">FY2020</text></svg>