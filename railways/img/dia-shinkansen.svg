<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d"><title id="t">Tokyo–Shin-Osaka travel times</title><desc id="d">The fastest train from Tokyo to Shin-Osaka took 4 hours in fiscal 1964 with Series 0 trains at 210 km/h, 3 hours 10 minutes in fiscal 1965, and 2 hours 21 minutes in March 2025 with trains at 285 km/h.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="800" height="330" fill="#fff"/><text x="400.0" y="30" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Fastest Tōkaidō Shinkansen, Tokyo – Shin-Osaka</text><text x="120" y="100" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">FY1964</text><rect x="135" y="70" width="480.0" height="44" rx="6" fill="#2d5f9a"/><text x="603.0" y="99" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#fff">4 h 00 min</text><text x="627.0" y="99" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">Series 0, 210 km/h</text><text x="120" y="180" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">FY1965</text><rect x="135" y="150" width="380.0" height="44" rx="6" fill="#2d5f9a"/><text x="503.0" y="179" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#fff">3 h 10 min</text><text x="527.0" y="179" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555"></text><text x="120" y="260" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">March 2025</text><rect x="135" y="230" width="282.0" height="44" rx="6" fill="#b8412f"/><text x="405.0" y="259" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#fff">2 h 21 min</text><text x="429.0" y="259" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">N700S, 285 km/h</text></svg>