<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="t d"><title id="t">Tokyo subways compared with New York, London and Paris</title><desc id="d">Tokyo Metro has 195 km of route and 7.55 million riders a day (2019); Toei 109 km and 2.83 million. New York has 378 km and 4.73 million (2017), London 408 km and 3.79 million (2019), Paris 215.9 km and 4.22 million (2017).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="860" height="400" fill="#fff"/><text x="430.0" y="30" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Route length and riders per day</text><text x="215" y="62" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#555">route length (km)</text><text x="645" y="62" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#555">riders per day (10,000s)</text><text x="430.0" y="106" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">Tokyo Metro</text><rect x="223.75" y="88" width="146.25" height="26" rx="4" fill="#b8412f" opacity=".85"/><text x="215.75" y="107" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">195</text><rect x="490" y="88" width="317.09999999999997" height="26" rx="4" fill="#b8412f" opacity=".85"/><text x="815.0999999999999" y="107" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">755</text><text x="430.0" y="156" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">Toei Subway</text><rect x="288.25" y="138" width="81.75" height="26" rx="4" fill="#b8412f" opacity=".85"/><text x="280.25" y="157" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">109</text><rect x="490" y="138" width="118.86" height="26" rx="4" fill="#b8412f" opacity=".85"/><text x="616.86" y="157" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">283</text><text x="430.0" y="206" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">New York</text><rect x="86.5" y="188" width="283.5" height="26" rx="4" fill="#2d5f9a" opacity=".85"/><text x="78.5" y="207" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">378</text><rect x="490" y="188" width="198.66" height="26" rx="4" fill="#2d5f9a" opacity=".85"/><text x="696.66" y="207" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">473</text><text x="430.0" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">London</text><rect x="64.0" y="238" width="306.0" height="26" rx="4" fill="#2d5f9a" opacity=".85"/><text x="56.0" y="257" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#222">408</text><rect x="490" y="238" width="159.18" height="26" rx="4" fill="#2d5f9a" opacity=".85"/><text x="657.1800000000001" y="257" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fi