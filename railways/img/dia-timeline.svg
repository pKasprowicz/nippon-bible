<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d"><title id="t">Timeline of Japan’s railways</title><desc id="d">From the first railway between Shinbashi and Yokohama (1872), nationalisation (1906), the Takarazuka line (1910) and the first subways in Tokyo (1927) and Osaka (1933), through JNR (1949) and the Tōkaidō Shinkansen (1964), to the split of JNR into the JR companies (1987), Tokyo Metro (2004), nationwide IC cards (2013) and the Shinkansen to Tsuruga (2024).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="200" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Japan’s railways: a timeline of this handbook</text><line x1="30" y1="120" x2="970" y2="120" stroke="#bbb" stroke-width="4"/><circle cx="64" cy="120" r="7" fill="#2d5f9a"/><text x="64" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1872</text><text x="64" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Shinbashi–</text><text x="64" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Yokohama</text><circle cx="151" cy="120" r="7" fill="#2d5f9a"/><text x="151" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1906</text><text x="151" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">main private</text><text x="151" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">lines nationalised</text><circle cx="238" cy="120" r="7" fill="#2d5f9a"/><text x="238" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1910</text><text x="238" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Kobayashi’s</text><text x="238" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Takarazuka line</text><circle cx="325" cy="120" r="7" fill="#2d5f9a"/><text x="325" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1927</text><text x="325" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">first subway:</text><text x="325" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Ueno–Asakusa</text><circle cx="412" cy="120" r="7" fill="#2d5f9a"/><text x="412" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1933</text><text x="412" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Osaka’s first</text><text x="412" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">subway</text><circle cx="499" cy="120" r="7" fill="#2d5f9a"/><text x="499" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1949</text><text x="499" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">JNR founded</text><text x="499" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555"></text><circle cx="586" cy="120" r="7" fill="#2d5f9a"/><text x="586" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#2d5f9a">1964</text><text x="586" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Tōkaidō</text><text x="586" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Shinkansen</text><circle cx="673" cy="120" r="7" fill="#b8412f"/><text x="673" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b8412f">1987</text><text x="673" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">JNR split</text><text x="673" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">into JR</text><circle cx="760" cy="120" r="7" fill="#b8412f"/><text x="760" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b8412f">2004</text><text x="760" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Tokyo Metro</text><text x="760" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">founded</text><circle cx="847" cy="120" r="7" fill="#b8412f"/><text x="847" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b8412f">2013</text><text x="847" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">IC cards work</text><text x="847" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">nationwide</text><circle cx="934" cy="120" r="7" fill="#b8412f"/><text x="934" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b8412f">2024</text><text x="934" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Shinkansen</text><text x="934" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">to Tsuruga</text></svg>