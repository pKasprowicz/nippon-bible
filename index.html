<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nippon Bible</title>
  <meta name="description" content="A short Japanese survival course for European travellers: pronunciation, words, phrases, situations and reading signs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23fff'/%3E%3Ccircle cx='50' cy='50' r='26' fill='%23bc2c22'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { var t = localStorage.getItem('nb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open lesson menu" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text"><span class="brand-jp" lang="ja">日本</span> Nippon Bible</span>
    </a>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Lessons">
      <ol class="nav-list" id="navList"></ol>
      <div class="nav-extra">
        <a class="nav-link drill-link" href="#/drill" data-route="drill">
          <span class="nav-num" aria-hidden="true">✦</span><span>Flashcard drill</span>
        </a>
      </div>
      <p class="nav-hint">Tip: tap any <span lang="ja">日本語</span> text to hear it spoken.</p>
    </nav>
    <div class="scrim" id="scrim" hidden></div>

    <main id="content" class="content" tabindex="-1" aria-live="polite">
      <p class="loading">Loading…</p>
    </main>
  </div>

  <footer class="footer">
    <span>Nippon Bible <span id="version"></span></span>
    <span class="dot" aria-hidden="true">·</span>
    <a href="https://github.com/pKasprowicz/nippon-bible">Source on GitHub</a>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/hiragana-data.js"></script>
  <script src="assets/katakana-data.js"></script>
  <script src="assets/kana-engine.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
