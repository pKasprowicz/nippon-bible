name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        # Publish every tracked file except CI and tooling, so new content folders deploy automatically.
        run: |
          mkdir _site
          git ls-files -z | grep -zvE '^(\.github|scripts|terms)/' | xargs -0 cp --parents -t _site
          test -f _site/index.html && test -d _site/lessons && test -d _site/hiragana && test -d _site/katakana && test -d _site/kanji && test -d _site/cuisine/img && test -d _site/folklore/img && test -d _site/popculture/img && test -d _site/bathing/img && test -d _site/railways/img && test -f _site/assets/signs/photos.json
          find _site -type f | wc -l
      - name: Build the search index
        run: |
          node scripts/build-search.mjs _site
          test -s _site/search-index.json
      - name: Build the pop-up dictionary
        run: |
          node scripts/build-terms.mjs _site
          test -s _site/assets/terms.json
      - name: Prepare offline app (precache list and service-worker build stamp)
        run: |
          node scripts/build-offline.mjs _site
          test -f _site/precache.json && ! grep -q "'__BUILD__'" _site/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
