<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d"><title id="t">How the Hot Springs Act defines an onsen</title><desc id="d">Water, steam or gas springing from underground is an onsen if it is at least 25 °C when taken from the source, or, if colder, if it contains at least one of 19 listed substances in the legal amount, such as 1,000 mg/kg of dissolved solids. A stricter list defines a therapeutic spring.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="450" fill="#fff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Is it an onsen? The test of the Hot Springs Act (1948)</text><rect x="300" y="56" width="300" height="64" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="450" y="82" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">Water, steam or gas springing</text><text x="450" y="101" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">from underground</text><line x1="450" y1="122" x2="450" y2="150" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="250" y="150" width="400" height="56" rx="10" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="450" y="174" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#1f6f8b">At least 25 °C when taken from the source?</text><text x="450" y="196" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">(natural gas that is mainly hydrocarbons is excluded)</text><line x1="650" y1="178" x2="730" y2="178" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#ah)"/><text x="690" y="170" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:700" fill="#1f6f8b">yes</text><rect x="730" y="140" width="150" height="76" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2"/><text x="805" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#fff">onsen</text><text x="805" y="194" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#fff">by law</text><line x1="450" y1="208" x2="450" y2="246" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><text x="466" y="232" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:700" fill="#555">no</text><rect x="150" y="246" width="600" height="98" rx="10" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="450" y="272" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#1f6f8b">Contains at least one of 19 substances in the legal amount?</text><text x="450" y="296" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">e.g. dissolved solids ≥ 1,000 mg/kg · free carbon dioxide ≥ 250 mg</text><text x="450" y="313" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">total sulphur ≥ 1 mg · metaboric acid ≥ 5 mg · radon ≥ 20 × 10⁻¹⁰ Ci</text><text x="450" y="330" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">(one is enough, even in cold water)</text><path d="M 750 295 C 800 295, 805 260, 805 220" fill="none" stroke="#1f6f8b" stroke-width="2.5" marker-end="url(#ah)"/><text x="790" y="280" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:700" fill="#1f6f8b">yes</text><line x1="450" y1="346" x2="450" y2="382" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><text x="466" y="370" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:700" fill="#555">no</text><rect x="300" y="382" width="300" height="48" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="2"/><text x="450" y="412" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#555">not an onsen under the Act</text><rect x="30" y="140" width="190" height="92" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2" stroke-dasharray="6 5"/><text x="125" y="164" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#b5502c">A stricter list defines a</text><text x="125" y="181" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#b5502c">“therapeutic spring”</text><text x="125" y="198" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#b5502c">(ryōyōsen): see</text><text x="125" y="215" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#b5502c">Chapter 3</text></svg>