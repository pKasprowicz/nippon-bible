<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 505" width="980" height="505" role="img" aria-labelledby="t d"><title id="t">Scales and spring types on an analysis sheet</title><desc id="d">Temperature at the source: cold below 25 °C, low 25–34, warm 34–42, high 42 and above. pH: acidic below 3, weakly acidic 3–6, neutral 6–7.5, weakly alkaline 7.5–8.5, alkaline 8.5 and above. Tonicity: hypotonic below 8,000 mg/kg, isotonic to 10,000, hypertonic above. Ten posted spring types: simple, chloride, hydrogen-carbonate, sulphate, carbon dioxide, iron, acidic, iodine, sulphur and radioactive.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="980" height="505" fill="#fff"/><text x="490.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">The four scales on an onsen analysis sheet</text><text x="30" y="68" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Temperature at the source</text><rect x="30.0" y="80" width="227.0" height="40" rx="6" fill="#e3f1f6"/><text x="145.0" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">cold spring</text><rect x="260.0" y="80" width="227.0" height="40" rx="6" fill="#f6e3d3"/><text x="375.0" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">low-temperature</text><rect x="490.0" y="80" width="227.0" height="40" rx="6" fill="#f1c9a8"/><text x="605.0" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">warm</text><rect x="720.0" y="80" width="227.0" height="40" rx="6" fill="#e8a27f"/><text x="835.0" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">high-temperature</text><text x="258.5" y="138" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">25 °C</text><text x="488.5" y="138" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">34 °C</text><text x="718.5" y="138" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">42 °C</text><text x="30" y="168" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Acidity (pH)</text><rect x="30.0" y="180" width="181.0" height="40" rx="6" fill="#f6d6c4"/><text x="122.0" y="205" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">acidic</text><rect x="214.0" y="180" width="181.0" height="40" rx="6" fill="#f8e6d8"/><text x="306.0" y="205" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">weakly acidic</text><rect x="398.0" y="180" width="181.0" height="40" rx="6" fill="#eeeeee"/><text x="490.0" y="205" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">neutral</text><rect x="582.0" y="180" width="181.0" height="40" rx="6" fill="#d9edf5"/><text x="674.0" y="205" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">weakly alkaline</text><rect x="766.0" y="180" width="181.0" height="40" rx="6" fill="#b9dceb"/><text x="858.0" y="205" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">alkaline</text><text x="212.5" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">3</text><text x="396.5" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">6</text><text x="580.5" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">7.5</text><text x="764.5" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">8.5</text><text x="30" y="268" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Tonicity (dissolved solids per kg)</text><rect x="30.0" y="280" width="303.6666666666667" height="40" rx="6" fill="#d9edf5"/><text x="183.33333333333334" y="305" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">hypotonic</text><rect x="336.6666666666667" y="280" width="303.6666666666667" height="40" rx="6" fill="#b9dceb"/><text x="490.0" y="305" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">isotonic</text><rect x="643.3333333333334" y="280" width="303.6666666666667" height="40" rx="6" fill="#94c8de"/><text x="796.6666666666667" y="305" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">hypertonic</text><text x="335.1666666666667" y="338" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">8,000 mg</text><text x="641.8333333333334" y="338" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#555">10,000 mg</text><text x="30" y="368" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Spring type (the posted name)</text><rect x="30" y="380" width="178" height="38" rx="8" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="119" y="405" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">simple spring</text><rect x="216" y="380" width="178" height="38" rx="8" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="305" y="405" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">chloride</text><rect x="402" y="380" width="178" height="38" rx="8" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="491" y="405" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">hydrogen-carbonate</text><rect x="588" y="380" width="178" height="38" rx="8" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="677" y="405" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">sulphate</text><rect x="774" y="380" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="863" y="405" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">carbon dioxide</text><rect x="30" y="426" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="119" y="451" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">iron</text><rect x="216" y="426" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="305" y="451" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">acidic</text><rect x="402" y="426" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="491" y="451" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">iodine</text><rect x="588" y="426" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="677" y="451" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">sulphur</text><rect x="774" y="426" width="178" height="38" rx="8" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="863" y="451" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#222">radioactive</text><text x="490.0" y="490" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:12.5px;font-weight:400" fill="#555">Blue: by main dissolved salt (or below 1,000 mg/kg: “simple”) · orange: named after a special component</text></svg>