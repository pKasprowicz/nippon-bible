<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d"><title id="t">Temperature rising with depth</title><desc id="d">A column of ground warming by about 3 °C per 100 metres: about 20 °C at the surface, about 50 °C at 1,000 m and over 100 °C at 3,000 m. Deep wells reach the deep hot water under the southern Kantō plain; near young volcanoes magma heats water more strongly.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="470" fill="#fff"/><text x="380.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Why there is hot water even far from volcanoes</text><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3e7"/><stop offset="1" stop-color="#e8a27f"/></linearGradient></defs><rect x="120" y="70" width="240" height="360" fill="url(#g)"/><line x1="112" y1="70.0" x2="360" y2="70.0" stroke="#bbb" stroke-dasharray="4 4"/><text x="106" y="75.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">0 m</text><text x="376" y="75.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#b5502c">≈ 20 °C (surface)</text><line x1="112" y1="180.0" x2="360" y2="180.0" stroke="#bbb" stroke-dasharray="4 4"/><text x="106" y="185.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">1,000 m</text><text x="376" y="185.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#b5502c">≈ 50 °C</text><line x1="112" y1="400.0" x2="360" y2="400.0" stroke="#bbb" stroke-dasharray="4 4"/><text x="106" y="405.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">3,000 m</text><text x="376" y="405.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#b5502c">over 100 °C</text><line x1="240" y1="400" x2="240" y2="74" stroke="#1f6f8b" stroke-width="7"/><text x="240" y="452" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#1f6f8b">a deep well</text><text x="560" y="110" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#1f6f8b">The ground warms by</text><text x="560" y="131" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#1f6f8b">about 3 °C every 100 m.</text><text x="560" y="190.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Under the plains of southern</text><text x="560" y="208.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Kantō lies “deep hot water”</text><text x="560" y="227.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">(shinsō netsusui). Deep wells</text><text x="560" y="245.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">reach it: that is where central</text><text x="560" y="264.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Tokyo’s onsen come from.</text><text x="560" y="330.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Near young volcanoes, magma</text><text x="560" y="348.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">a few to about 10 km down</text><text x="560" y="367.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">heats water far more strongly.</text></svg>