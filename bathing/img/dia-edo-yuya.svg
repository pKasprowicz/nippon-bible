<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="t d"><title id="t">Plan of an Edo bathhouse</title><desc id="d">From the street entrance the bather paid at the raised takaza, then turned left for the men’s side or right for the women’s side. Each side had a changing room, a washing area, and a tub behind the zakuroguchi, a low board over the tub front that kept heat and steam in.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="450" fill="#fff"/><text x="450.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">An Edo bathhouse (yuya), after the Morisada mankō</text><rect x="40" y="380" width="820" height="46" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="2"/><text x="450" y="409" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#555">entrance from the street (doma, earth-floored)</text><rect x="390" y="300" width="120" height="64" rx="6" fill="#fbe9e1" stroke="#b5502c" stroke-width="2"/><text x="450" y="326" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#b5502c">takaza</text><text x="450" y="344" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#b5502c">(the “bandai”)</text><rect x="40" y="210" width="340" height="154" rx="4" fill="#fff" stroke="#222" stroke-width="2"/><text x="210" y="280" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#222">men’s changing room</text><rect x="520" y="210" width="340" height="154" rx="4" fill="#fff" stroke="#222" stroke-width="2"/><text x="690" y="280" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#222">women’s changing room</text><rect x="40" y="110" width="340" height="100" rx="4" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="210" y="165" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#1f6f8b">washing area</text><rect x="520" y="110" width="340" height="100" rx="4" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="690" y="165" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:600" fill="#1f6f8b">washing area</text><rect x="40" y="56" width="340" height="54" rx="4" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2"/><text x="210" y="89" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#fff">tub, behind the zakuroguchi</text><rect x="520" y="56" width="340" height="54" rx="4" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="2"/><text x="690" y="89" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#fff">tub, behind the zakuroguchi</text><line x1="40" y1="108" x2="380" y2="108" stroke="#b5502c" stroke-width="6"/><line x1="520" y1="108" x2="860" y2="108" stroke="#b5502c" stroke-width="6"/><text x="450" y="140" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">zakuroguchi:</text><text x="450" y="156" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">a low board</text><text x="450" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">over the tub</text><text x="450" y="188" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">front; stoop</text><text x="450" y="204" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">to pass. It</text><text x="450" y="220" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">kept the heat</text><text x="450" y="236" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b5502c">and steam in.</text></svg>