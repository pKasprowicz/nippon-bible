<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" width="1000" height="262" role="img" aria-labelledby="t d"><title id="t">The steps of a Japanese bath</title><desc id="d">Six steps: take off your shoes; undress fully, without a swimsuit; wash at a washing place and rinse off the soap; pour hot water over yourself (kakeyu); soak quietly with the towel out of the water and long hair tied up; afterwards pat dry, keep warm, rest and drink a glass of water. No photographs, loud talk or swimming; drink water before and after.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="262" fill="#fff"/><text x="500.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">A bath, step by step</text><rect x="20" y="56" width="150" height="160" rx="12" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><circle cx="95" cy="88" r="20" fill="#1f6f8b"/><text x="95" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">1</text><text x="95" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Shoes off</text><text x="95" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">before the changing</text><text x="95" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">room; lockers are</text><text x="95" y="190" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">provided</text><line x1="171" y1="131" x2="182" y2="131" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ah)"/><rect x="183" y="56" width="150" height="160" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/><circle cx="258" cy="88" r="20" fill="#1f6f8b"/><text x="258" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">2</text><text x="258" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Undress fully</text><text x="258" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">clothes in a basket</text><text x="258" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">or locker; no</text><text x="258" y="190" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">swimsuit</text><line x1="334" y1="131" x2="345" y2="131" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ah)"/><rect x="346" y="56" width="150" height="160" rx="12" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><circle cx="421" cy="88" r="20" fill="#1f6f8b"/><text x="421" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">3</text><text x="421" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Wash first</text><text x="421" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">at a washing place;</text><text x="421" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">rinse off the soap</text><line x1="497" y1="131" x2="508" y2="131" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ah)"/><rect x="509" y="56" width="150" height="160" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/><circle cx="584" cy="88" r="20" fill="#1f6f8b"/><text x="584" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">4</text><text x="584" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Kakeyu</text><text x="584" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">pour hot water over</text><text x="584" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">yourself to get used</text><text x="584" y="190" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">to the heat</text><line x1="660" y1="131" x2="671" y2="131" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ah)"/><rect x="672" y="56" width="150" height="160" rx="12" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><circle cx="747" cy="88" r="20" fill="#1f6f8b"/><text x="747" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">5</text><text x="747" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Soak quietly</text><text x="747" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">towel out of the</text><text x="747" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">water; long hair</text><text x="747" y="190" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">tied up</text><line x1="823" y1="131" x2="834" y2="131" stroke="#1f6f8b" stroke-width="2" marker-end="url(#ah)"/><rect x="835" y="56" width="150" height="160" rx="12" fill="#fff" stroke="#1f6f8b" stroke-width="2"/><circle cx="910" cy="88" r="20" fill="#1f6f8b"/><text x="910" y="95" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#fff">6</text><text x="910" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Rest</text><text x="910" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">pat dry, keep warm,</text><text x="910" y="175" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">rest and drink a</text><text x="910" y="190" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">glass of water</text><text x="500.0" y="244" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:600" fill="#b5502c">Throughout: no photographs, no loud talk, no swimming; drink water before and after.</text></svg>