<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d"><title id="t">Number of sentō, 1968 and 2024</title><desc id="d">Japan had 18,325 public bathhouses at the peak in 1968 and 2,847 at the end of March 2024. By 2008, 95.5 per cent of homes had their own bath.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="420" fill="#fff"/><text x="380.0" y="30" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Public bathhouses (sentō) in Japan</text><line x1="110" y1="350.0" x2="690" y2="350.0" stroke="#e6e6e6"/><text x="100" y="355.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">0</text><line x1="110" y1="282.5" x2="690" y2="282.5" stroke="#e6e6e6"/><text x="100" y="287.5" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">5,000</text><line x1="110" y1="215.0" x2="690" y2="215.0" stroke="#e6e6e6"/><text x="100" y="220.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">10,000</text><line x1="110" y1="147.5" x2="690" y2="147.5" stroke="#e6e6e6"/><text x="100" y="152.5" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">15,000</text><line x1="110" y1="80.0" x2="690" y2="80.0" stroke="#e6e6e6"/><text x="100" y="85.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">20,000</text><text x="110.0" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">1960</text><text x="192.85714285714283" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">1970</text><text x="275.71428571428567" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">1980</text><text x="358.57142857142856" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">1990</text><text x="441.4285714285714" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">2000</text><text x="524.2857142857142" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">2010</text><text x="607.1428571428571" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">2020</text><text x="690.0" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">2030</text><line x1="176.28571428571428" y1="102.61250000000001" x2="640.2857142857142" y2="311.5655" stroke="#1f6f8b" stroke-width="3" stroke-dasharray="8 6"/><circle cx="176.28571428571428" cy="102.61250000000001" r="8" fill="#1f6f8b"/><text x="190.28571428571428" y="88.61250000000001" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#1f6f8b">peak: 18,325 (1968)</text><circle cx="640.2857142857142" cy="311.5655" r="8" fill="#1f6f8b"/><text x="626.2857142857142" y="316.5655" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#1f6f8b">2,847 (March 2024)</text><text x="308.8571428571429" y="262.25" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">Homes got their own baths:</text><text x="308.8571428571429" y="280.75" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:400" fill="#555">by 2008, 95.5% of homes had one.</text><text x="380.0" y="402" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:12px;font-weight:400" fill="#555">Two data points; the dashed line does not show the path between them.</text></svg>