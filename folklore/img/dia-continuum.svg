<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395" role="img" aria-labelledby="t d"><title id="t">The kami–yōkai continuum</title><desc id="d">A horizontal line with kami (benevolent, worshipped) at one end and yōkai (malevolent or neutral, not worshipped) at the other. Arrows show movement both ways: pacified spirits become kami, offended kami slide toward yōkai.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="395" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Kami and yōkai: two ends of one line (Komatsu Kazuhiko)</text><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e6f1e6"/><stop offset="1" stop-color="#fdecec"/></linearGradient></defs><rect x="60" y="70" width="880" height="56" rx="28" fill="url(#g)" stroke="#bbb"/><text x="130" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:800" fill="#3f7a3f">KAMI</text><text x="870" y="105" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:800" fill="#a33">YŌKAI</text><text x="200" y="160" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">benevolent toward humans</text><text x="200" y="179" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">worshipped</text><text x="800" y="160" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">malevolent or neutral</text><text x="800" y="179" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">not worshipped</text><path d="M 720 222 C 600 262, 400 262, 280 222" fill="none" stroke="#3f7a3f" stroke-width="2.5" marker-end="url(#ah)"/><text x="500" y="280" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#3f7a3f">honoured and pacified: a vengeful spirit becomes a goryō, then a kami</text><path d="M 280 312 C 400 352, 600 352, 720 312" fill="none" stroke="#a33" stroke-width="2.5" marker-end="url(#ah)"/><text x="500" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#a33">turned hostile toward humans: a kami moves to the yōkai end (e.g. the kappa, often explained as a degraded water deity)</text></svg>