<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" width="1000" height="265" role="img" aria-labelledby="t d"><title id="t">How a vengeful spirit becomes a god</title><desc id="d">Kuroda Toshio’s three steps: angry spirit (roaming, fear), goryō ceremony (pacification, prevention of disasters), goryō belief (enshrinement, call for divine favour).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="265" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">How a vengeful spirit becomes a god (Kuroda Toshio)</text><rect x="30" y="70" width="280" height="120" rx="10" fill="#fdecec" stroke="#a33" stroke-width="2"/><text x="170" y="108" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#a33">1. Angry spirit</text><text x="170" y="140" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= roaming</text><text x="170" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= fear</text><line x1="313" y1="130" x2="357" y2="130" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="360" y="70" width="280" height="120" rx="10" fill="#fff4ea" stroke="#94530f" stroke-width="2"/><text x="500" y="108" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#94530f">2. Goryō ceremony</text><text x="500" y="140" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= pacification</text><text x="500" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= prevention of disasters</text><line x1="643" y1="130" x2="687" y2="130" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="690" y="70" width="280" height="120" rx="10" fill="#e6f1e6" stroke="#3f7a3f" stroke-width="2"/><text x="830" y="108" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#3f7a3f">3. Goryō belief</text><text x="830" y="140" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= enshrinement</text><text x="830" y="160" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:400" fill="#222">= call for divine favour</text><text x="500" y="230" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">Example: six people who died after false accusations were honoured at the first goryō ceremony in 863;</text><text x="500" y="249" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">Sugawara no Michizane became Tenjin; Gozu Tennō, a deity of epidemics, was worshipped at Gion.</text></svg>