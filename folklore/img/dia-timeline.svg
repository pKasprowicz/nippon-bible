<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="t d"><title id="t">Timeline of kami and buddhas</title><desc id="d">From the arrival of Buddhism (538 or 552) through the Kojiki and Nihon shoki (712, 720), the first goryō ceremony (863), honji suijaku (mid-10th century), the reading shintō (14th century) and kami initiations (early 19th century) to the Separation Orders of 1868 and the 1981 survey showing 93.8 per cent Buddhist funerals.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="270" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Kami and buddhas: a thousand years together, then separation</text><line x1="40" y1="120" x2="960" y2="120" stroke="#bbb" stroke-width="4"/><circle cx="92.0" cy="120" r="8" fill="#5b4a8a"/><text x="92.0" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">538 / 552</text><text x="92.0" y="56" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Buddhism formally reaches</text><text x="92.0" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">the court (two datings)</text><circle cx="183.5" cy="120" r="8" fill="#5b4a8a"/><text x="183.5" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">712 · 720</text><text x="183.5" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Kojiki and Nihon shoki</text><text x="183.5" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">compiled</text><circle cx="275.0" cy="120" r="8" fill="#5b4a8a"/><text x="275.0" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">8th c.</text><text x="275.0" y="56" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">kami need salvation: sutras,</text><text x="275.0" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">stupas for kami</text><circle cx="366.5" cy="120" r="8" fill="#5b4a8a"/><text x="366.5" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">863</text><text x="366.5" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">first goryō ceremony</text><text x="366.5" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">at the palace</text><circle cx="458.0" cy="120" r="8" fill="#5b4a8a"/><text x="458.0" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">mid-10th c.</text><text x="458.0" y="56" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">honji suijaku: kami as</text><text x="458.0" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">forms of buddhas</text><circle cx="549.5" cy="120" r="8" fill="#5b4a8a"/><text x="549.5" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">12th c.</text><text x="549.5" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">combination fully developed;</text><text x="549.5" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Shugendō</text><circle cx="641.0" cy="120" r="8" fill="#5b4a8a"/><text x="641.0" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">14th c.</text><text x="641.0" y="56" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">the reading “shintō”</text><text x="641.0" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">appears in initiations</text><circle cx="732.5" cy="120" r="8" fill="#5b4a8a"/><text x="732.5" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#5b4a8a">early 19th c.</text><text x="732.5" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">kami initiations in</text><text x="732.5" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Buddhism most widespread</text><circle cx="824.0" cy="120" r="8" fill="#94530f"/><text x="824.0" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#94530f">1868</text><text x="824.0" y="56" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Separation Orders:</text><text x="824.0" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">shinbutsu bunri</text><circle cx="915.5" cy="120" r="8" fill="#94530f"/><text x="915.5" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#94530f">1981</text><text x="915.5" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">93.8% of funerals</text><text x="915.5" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">still Buddhist</text><rect x="200" y="215" width="600" height="10" rx="5" fill="#ebe6f6" stroke="#5b4a8a"/><text x="500" y="248" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#5b4a8a">combined worship (shinbutsu shūgō)</text><rect x="815" y="215" width="150" height="10" rx="5" fill="#fff4ea" stroke="#94530f"/><text x="890" y="248" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#94530f">after 1868</text></svg>