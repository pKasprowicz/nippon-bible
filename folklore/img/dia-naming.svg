<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" role="img" aria-labelledby="t d"><title id="t">How naming made new yōkai</title><desc id="d">Before: a strange sound was explained as the spirit of a dead young monk or the work of a fox or tanuki. After naming in the Edo period: a being called azuki-arai makes the sound called azuki-arai.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="335" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">How naming made new yōkai: azuki-arai, “the bean-washer”</text><text x="250" y="76" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#555">Before (ancient and medieval)</text><text x="750" y="76" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#5b4a8a">After (Edo period)</text><rect x="150" y="95" width="200" height="60" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2"/><text x="250" y="131" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">a strange sound</text><rect x="40" y="210" width="200" height="70" rx="10" fill="#fff4ea" stroke="#94530f" stroke-width="2"/><text x="140" y="240" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">a dead young</text><text x="140" y="259" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">monk’s spirit</text><rect x="260" y="210" width="200" height="70" rx="10" fill="#fff4ea" stroke="#94530f" stroke-width="2"/><text x="360" y="240" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">a fox or</text><text x="360" y="259" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">tanuki</text><line x1="140" y1="208" x2="210" y2="158" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><line x1="360" y1="208" x2="290" y2="158" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><text x="250" y="310" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:14px;font-weight:400" fill="#555">explained by a few known causes</text><rect x="650" y="95" width="200" height="60" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="750" y="131" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">azuki-arai</text><rect x="650" y="220" width="200" height="60" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2"/><text x="750" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">the sound “azuki-arai”</text><line x1="750" y1="157" x2="750" y2="216" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><text x="765" y="192" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#5b4a8a">makes</text><text x="750" y="310" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:14px;font-weight:400" fill="#555">the name becomes a being of its own</text><line x1="500" y1="70" x2="500" y2="320" stroke="#bbb" stroke-width="2" stroke-dasharray="6 6"/></svg>