<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" width="1000" height="465" role="img" aria-labelledby="t d"><title id="t">The katashiro purification rite</title><desc id="d">Six steps: the priest makes paper figures, parishioners write their names on them, breathe on them, return them to the shrine, the priest purifies them on New Year’s Eve, and they are floated away. Fire purifies in December, water in June.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="465" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">The paper substitute (katashiro): one shrine’s year-end rite</text><rect x="30" y="70" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="175" y="104" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">1. Made</text><text x="175" y="132" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">priest cuts paper figures:</text><text x="175" y="151" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">white for men, red for women</text><line x1="322" y1="125" x2="353" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="355" y="70" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="500" y="104" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">2. Taken home</text><text x="500" y="132" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">parishioner writes name</text><text x="500" y="151" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">and age on it</text><line x1="647" y1="125" x2="678" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="680" y="70" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="825" y="104" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">3. Charged</text><text x="825" y="132" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">breathes on it, rubs it</text><text x="825" y="151" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">over the body</text><rect x="30" y="220" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="175" y="254" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">4. Returned</text><text x="175" y="282" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">placed in a box at</text><text x="175" y="301" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">the shrine offering bin</text><line x1="322" y1="275" x2="353" y2="275" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="355" y="220" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="500" y="254" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">5. Purified</text><text x="500" y="282" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">New Year’s Eve, 7 p.m.:</text><text x="500" y="301" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">Great Purification prayer</text><line x1="647" y1="275" x2="678" y2="275" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="680" y="220" width="290" height="110" rx="10" fill="#ebe6f6" stroke="#5b4a8a" stroke-width="2"/><text x="825" y="254" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#5b4a8a">6. Sent away</text><text x="825" y="282" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">floated off on the water</text><text x="825" y="301" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">“to oblivion”</text><path d="M 790 182 C 790 200, 175 200, 175 218" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="380" width="455" height="70" rx="10" fill="#fff4ea" stroke="#94530f" stroke-width="2"/><text x="257" y="410" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#94530f">December: fire is the purifying medium</text><text x="257" y="434" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">old amulets, rakes, daruma and ropes are burned</text><rect x="515" y="380" width="455" height="70" rx="10" fill="#eaf3fb" stroke="#3b6f9a" stroke-width="2"/><text x="742" y="410" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#3b6f9a">June: the same rite with clear water</text><text x="742" y="434" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">“Winter is the fire season, summer the water season”</text></svg>