<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-labelledby="t d"><title id="t">Two readings of the Land of Yomi</title><desc id="d">Left: the common interpretation of three layers, heaven, the human world and an underground Yomi. Right: Kōnoshi Takamitsu’s reading, in which Izanagi flees down from the pass Yomotsu Hirasaka and blocks it with a boulder at its foot.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="432" fill="#fff"/><text x="250" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#222">The usual reading</text><text x="750" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:18px;font-weight:700" fill="#222">Kōnoshi’s reading of the Kojiki</text><rect x="70" y="60" width="360" height="85" rx="10" fill="#f3eefc" stroke="#bbb" stroke-width="2"/><text x="250" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Takamanohara</text><text x="250" y="122" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">high plain of heaven</text><rect x="70" y="165" width="360" height="85" rx="10" fill="#eef6ee" stroke="#bbb" stroke-width="2"/><text x="250" y="203" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Ashihara no Nakatsukuni</text><text x="250" y="227" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">the human world</text><rect x="70" y="270" width="360" height="85" rx="10" fill="#efe9e1" stroke="#bbb" stroke-width="2"/><text x="250" y="308" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Yomotsukuni</text><text x="250" y="332" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">land of Yomi, underground</text><text x="250" y="415" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:14px;font-weight:400" fill="#555">three layers, one above the other</text><rect x="560" y="300" width="120" height="50" rx="10" fill="#efe9e1" stroke="#bbb" stroke-width="2"/><text x="620" y="331" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Yomi</text><path d="M640 298 L720 150 L800 150 L880 298" fill="none" stroke="#8a7a5a" stroke-width="3"/><text x="760" y="136" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#94530f">Yomotsu Hirasaka (the pass)</text><circle cx="880" cy="282" r="16" fill="#9a9a9a"/><text x="856" y="287" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">boulder</text><line x1="784" y1="176" x2="846" y2="262" stroke="#94530f" stroke-width="2.5" marker-end="url(#ah)"/><text x="770" y="225" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#94530f">flees down</text><rect x="800" y="310" width="180" height="62" rx="10" fill="#eef6ee" stroke="#bbb" stroke-width="2"/><text x="890" y="337" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">Ashihara no</text><text x="890" y="356" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#222">Nakatsukuni</text><text x="890" y="390" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">the human world</text><text x="750" y="415" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:14px;font-weight:400" fill="#555">Yomi not necessarily underground; no three-layer world</text></svg>