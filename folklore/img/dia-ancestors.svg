<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="t d"><title id="t">From death to ancestor</title><desc id="d">Death, the 49th day when the tablet joins the ancestors, memorial years up to the 33rd, the final memorial, and the anonymous ancestors. Side paths: the first Bon of the newly dead, and the forgotten dead (muenbotoke) when no one tends the grave.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="340" fill="#fff"/><text x="500" y="34" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">From death to ancestor (Ooms’s village study)</text><rect x="20" y="70" width="172" height="110" rx="10" fill="#f3eefc" stroke="#5b4a8a" stroke-width="2"/><text x="106" y="102" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#5b4a8a">Death</text><text x="106" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">tablet (ihai) on a low</text><text x="106" y="149.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">stand below the altar</text><line x1="194" y1="125" x2="214" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="216" y="70" width="172" height="110" rx="10" fill="#f3eefc" stroke="#5b4a8a" stroke-width="2"/><text x="302" y="102" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#5b4a8a">49th day</text><text x="302" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">tablet joins the ancestors;</text><text x="302" y="149.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">soul leaves for the grave</text><line x1="390" y1="125" x2="410" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="412" y="70" width="172" height="110" rx="10" fill="#f3eefc" stroke="#5b4a8a" stroke-width="2"/><text x="498" y="102" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#5b4a8a">Memorial years</text><text x="498" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">e.g. 1, 3, 7, 13, 17, 23 …</text><text x="498" y="149.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">customarily to the 33rd</text><line x1="586" y1="125" x2="606" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="608" y="70" width="172" height="110" rx="10" fill="#f3eefc" stroke="#5b4a8a" stroke-width="2"/><text x="694" y="102" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#5b4a8a">Final memorial</text><text x="694" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">tomurai-age: the person</text><text x="694" y="149.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">fades as an individual</text><line x1="782" y1="125" x2="802" y2="125" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="804" y="70" width="172" height="110" rx="10" fill="#e6f1e6" stroke="#3f7a3f" stroke-width="2"/><text x="890" y="102" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#3f7a3f">Ancestors</text><text x="890" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">one tablet for “all</text><text x="890" y="149.5" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">generations of this house”</text><rect x="20" y="230" width="450" height="92" rx="10" fill="#fff4ea" stroke="#94530f" stroke-width="2" stroke-dasharray="6 5"/><text x="245" y="262" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#94530f">First Bon: shinmō, the newly dead</text><text x="245" y="288" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">pacified and sent off with special rites</text><text x="245" y="306" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">(Shima region: pole torch, nenbutsu)</text><rect x="530" y="230" width="450" height="92" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2" stroke-dasharray="6 5"/><text x="755" y="262" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#666">No one to tend the grave</text><text x="755" y="288" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">the dead may lapse into muenbotoke,</text><text x="755" y="306" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">“forgotten souls”</text><line x1="140" y1="182" x2="200" y2="228" stroke="#94530f" stroke-width="2.5" marker-end="url(#ah)"/><line x1="510" y1="182" x2="690" y2="228" stroke="#888" stroke-width="2.5" marker-end="url(#ah)"/></svg>