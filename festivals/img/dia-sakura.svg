<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d"><title id="t">Normal cherry-blossom dates by city</title><desc id="d">Normal opening and full-bloom dates, 1991–2020: Naha 16 January to 4 February (hikan-zakura); Fukuoka 22 to 31 March; Tokyo 24 to 31 March; Kyoto 26 March to 4 April; Osaka 27 March to 4 April; Sendai 8 to 13 April; Sapporo 1 to 6 May.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="900" height="340" fill="#fff"/><text x="450.0" y="30.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Cherry blossom: normal opening and full-bloom dates</text><line x1="120.0" y1="52" x2="120.0" y2="286" stroke="#eee" stroke-width="1"/><text x="124.0" y="300.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Jan 1</text><line x1="287.3" y1="52" x2="287.3" y2="286" stroke="#eee" stroke-width="1"/><text x="291.3" y="300.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Feb 1</text><line x1="438.3" y1="52" x2="438.3" y2="286" stroke="#eee" stroke-width="1"/><text x="442.3" y="300.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Mar 1</text><line x1="605.6" y1="52" x2="605.6" y2="286" stroke="#eee" stroke-width="1"/><text x="609.6" y="300.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">Apr 1</text><line x1="767.5" y1="52" x2="767.5" y2="286" stroke="#eee" stroke-width="1"/><text x="771.5" y="300.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11px;font-weight:400" fill="#555">May 1</text><text x="110.0" y="77.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Naha*</text><rect x="200.9" y="65" width="102.5" height="16" rx="4" fill="#f3b6c3"/><circle cx="200.9" cy="73" r="5" fill="#b3412f"/><circle cx="303.5" cy="73" r="5" fill="#c2185b"/><text x="313.5" y="77.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">16 Jan → 4 Feb</text><text x="110.0" y="109.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Fukuoka</text><rect x="551.7" y="97" width="48.6" height="16" rx="4" fill="#f3b6c3"/><circle cx="551.7" cy="105" r="5" fill="#b3412f"/><circle cx="600.2" cy="105" r="5" fill="#c2185b"/><text x="610.2" y="109.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">22 Mar → 31 Mar</text><text x="110.0" y="141.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Tokyo</text><rect x="562.4" y="129" width="37.8" height="16" rx="4" fill="#f3b6c3"/><circle cx="562.4" cy="137" r="5" fill="#b3412f"/><circle cx="600.2" cy="137" r="5" fill="#c2185b"/><text x="610.2" y="141.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">24 Mar → 31 Mar</text><text x="110.0" y="173.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Kyoto</text><rect x="573.2" y="161" width="48.6" height="16" rx="4" fill="#f3b6c3"/><circle cx="573.2" cy="169" r="5" fill="#b3412f"/><circle cx="621.8" cy="169" r="5" fill="#c2185b"/><text x="631.8" y="173.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">26 Mar → 4 Apr</text><text x="110.0" y="205.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Osaka</text><rect x="578.6" y="193" width="43.2" height="16" rx="4" fill="#f3b6c3"/><circle cx="578.6" cy="201" r="5" fill="#b3412f"/><circle cx="621.8" cy="201" r="5" fill="#c2185b"/><text x="631.8" y="205.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">27 Mar → 4 Apr</text><text x="110.0" y="237.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Sendai</text><rect x="643.4" y="225" width="27.0" height="16" rx="4" fill="#f3b6c3"/><circle cx="643.4" cy="233" r="5" fill="#b3412f"/><circle cx="670.4" cy="233" r="5" fill="#c2185b"/><text x="680.4" y="237.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">8 Apr → 13 Apr</text><text x="110.0" y="269.0" text-anchor="end" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;font-weight:700" fill="#222">Sapporo</text><rect x="767.5" y="257" width="27.0" height="16" rx="4" fill="#f3b6c3"/><circle cx="767.5" cy="265" r="5" fill="#b3412f"/><circle cx="794.5" cy="265" r="5" fill="#c2185b"/><text x="804.5" y="269.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">1 May → 6 May</text><circle cx="200" cy="321" r="5" fill="#b3412f"/><text x="210.0" y="325.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">opening day</text><circle cx="310" cy="321" r="5" fill="#c2185b"/><text x="320.0" y="325.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">full bloom</text><text x="410.0" y="325.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">* Naha: hikan-zakura; elsewhere mainly Somei-yoshino. 1991–2020 normals.</text></svg>