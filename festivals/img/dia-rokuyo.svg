<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="t d"><title id="t">The six days of rokuyō</title><desc id="d">The six days in order: senshō (morning lucky, afternoon unlucky), tomobiki (good for celebrations, funerals avoided), senbu (morning unlucky, afternoon lucky), butsumetsu (unlucky for everything), taian (lucky for everything, especially weddings) and shakkō (unlucky, noon is lucky).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="200" fill="#fff"/><text x="480.0" y="30.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Rokuyō: the six-day cycle</text><rect x="20" y="50" width="138" height="120" rx="10" fill="#fff" stroke="#b3412f" stroke-width="2"/><text x="89.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#222">先勝</text><text x="89.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">senshō</text><text x="89.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">morning lucky,</text><text x="89.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">afternoon unlucky</text><line x1="160" y1="110" x2="176" y2="110" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="178" y="50" width="138" height="120" rx="10" fill="#fff" stroke="#b3412f" stroke-width="2"/><text x="247.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#222">友引</text><text x="247.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">tomobiki</text><text x="247.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">good for celebrations,</text><text x="247.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">funerals avoided</text><line x1="318" y1="110" x2="334" y2="110" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="336" y="50" width="138" height="120" rx="10" fill="#fff" stroke="#b3412f" stroke-width="2"/><text x="405.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#222">先負</text><text x="405.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">senbu</text><text x="405.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">morning unlucky,</text><text x="405.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">afternoon lucky</text><line x1="476" y1="110" x2="492" y2="110" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="494" y="50" width="138" height="120" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="563.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#222">仏滅</text><text x="563.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">butsumetsu</text><text x="563.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">unlucky for</text><text x="563.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">everything</text><line x1="634" y1="110" x2="650" y2="110" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="652" y="50" width="138" height="120" rx="10" fill="#e3f1e8" stroke="#2d6a4f" stroke-width="2"/><text x="721.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#2d6a4f">大安</text><text x="721.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">taian</text><text x="721.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">lucky for everything,</text><text x="721.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">esp. weddings</text><line x1="792" y1="110" x2="808" y2="110" stroke="#bbb" stroke-width="1.6" marker-end="url(#ah)"/><rect x="810" y="50" width="138" height="120" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="879.0" y="84.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:22px;font-weight:700" fill="#222">赤口</text><text x="879.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">shakkō</text><text x="879.0" y="128.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">unlucky;</text><text x="879.0" y="144.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#222">noon is lucky</text><text x="480.0" y="190.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">Then the cycle starts again. Meanings vary; these are the usual ones.</text></svg>