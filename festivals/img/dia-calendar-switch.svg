<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" width="820" height="210" role="img" aria-labelledby="t d"><title id="t">The calendar switch of 1872–1873</title><desc id="d">The second day of the twelfth month of Meiji 5 (1872) was the last day of the old calendar. The next day, which would have been the third day of the twelfth month, became 1 January of Meiji 6 (1873), the first day of the solar calendar.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="820" height="210" fill="#fff"/><text x="410.0" y="30.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">The switch to the solar calendar</text><rect x="30" y="60" width="300" height="90" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="180.0" y="92.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">Meiji 5 (1872)</text><text x="180.0" y="112.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">12th month, 2nd day</text><text x="180.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">last day of the old calendar</text><line x1="340" y1="105" x2="478" y2="105" stroke="#b3412f" stroke-width="3" marker-end="url(#ah)"/><text x="409.0" y="92.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:600" fill="#b3412f">next day</text><rect x="490" y="60" width="300" height="90" rx="10" fill="#fbe7e2" stroke="#b3412f" stroke-width="2"/><text x="640.0" y="92.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b3412f">Meiji 6 (1873)</text><text x="640.0" y="112.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b3412f">1 January</text><text x="640.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#b3412f">first day of the solar calendar</text><text x="410.0" y="185.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">The 3rd day of the 12th month of Meiji 5 became 1 January of Meiji 6: the rest of the old 12th month was skipped.</text></svg>