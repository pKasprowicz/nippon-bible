<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-labelledby="t d"><title id="t">The pattern of a shrine festival</title><desc id="d">The kami is moved from the shrine into a mikoshi, goes out through the parish with the floats (shinkōsai), stays at a temporary lodging (otabisho), and is carried round the parish again and back to the shrine (kankōsai).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="264" fill="#fff"/><text x="480.0" y="30.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">The pattern of a shrine festival</text><rect x="20" y="70" width="168" height="110" rx="10" fill="#f4f4f4" stroke="#777" stroke-width="2"/><text x="104.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#777">Shrine</text><text x="104.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">the kami’s</text><text x="104.0" y="149.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">home</text><line x1="190" y1="125" x2="206" y2="125" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="208" y="70" width="168" height="110" rx="10" fill="#fbe7e2" stroke="#b3412f" stroke-width="2"/><text x="292.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#b3412f">Into the mikoshi</text><text x="292.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">the kami is moved</text><text x="292.0" y="149.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">into a portable shrine</text><line x1="378" y1="125" x2="394" y2="125" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="396" y="70" width="168" height="110" rx="10" fill="#fbe7e2" stroke="#b3412f" stroke-width="2"/><text x="480.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#b3412f">Going out</text><text x="480.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">shinkōsai: through the</text><text x="480.0" y="149.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">parish, with floats</text><line x1="566" y1="125" x2="582" y2="125" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="584" y="70" width="168" height="110" rx="10" fill="#e3f1e8" stroke="#2d6a4f" stroke-width="2"/><text x="668.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#2d6a4f">Otabisho</text><text x="668.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">temporary</text><text x="668.0" y="149.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">lodging</text><line x1="754" y1="125" x2="770" y2="125" stroke="#555" stroke-width="2" marker-end="url(#ah)"/><rect x="772" y="70" width="168" height="110" rx="10" fill="#fbe7e2" stroke="#b3412f" stroke-width="2"/><text x="856.0" y="104.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#b3412f">Return</text><text x="856.0" y="132.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">kankōsai: round the</text><text x="856.0" y="149.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">parish and back</text><path d="M 860 186 C 860 240, 104 240, 104 186" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="480.0" y="252.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">back to the shrine</text></svg>