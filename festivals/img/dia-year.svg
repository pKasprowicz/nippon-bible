<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d"><title id="t">A year of Japanese festivals and seasons</title><desc id="d">Month by month: New Year, seven-herb porridge and the little New Year in January; setsubun and the Snow Festival in February; the Girls’ Festival and cherry blossom in March and April; Golden Week, Children’s Day and the Aoi and Kanda festivals in May; Sannō in June; Tanabata, Gion, Tenjin and fireworks in July; Nebuta, Sendai Tanabata, Bon and Awa Odori in August; the harvest moon and higan in September; the Jidai Matsuri and red leaves in October; Shichi-Go-San in November; the solstice and New Year’s Eve in December.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="380" fill="#fff"/><text x="500.0" y="30.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">A year of Japanese festivals and seasons</text><rect x="12" y="48" width="156" height="150" rx="8" fill="#e4ecf7" stroke="#ccc" stroke-width="1"/><text x="90.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Jan</text><text x="90.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">New Year (1–3)</text><text x="90.0" y="117.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">seven herbs (7)</text><text x="90.0" y="136.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">mirror cakes (11)</text><text x="90.0" y="155.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">little New Year (15)</text><rect x="176" y="48" width="156" height="150" rx="8" fill="#e4ecf7" stroke="#ccc" stroke-width="1"/><text x="254.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Feb</text><text x="254.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">setsubun (3)</text><text x="254.0" y="117.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">risshun (4)</text><text x="254.0" y="136.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Snow Festival</text><rect x="340" y="48" width="156" height="150" rx="8" fill="#e3f1e8" stroke="#ccc" stroke-width="1"/><text x="418.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Mar</text><text x="418.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Girls’ Festival (3)</text><text x="418.0" y="117.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">spring higan</text><text x="418.0" y="136.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">cherry blossom</text><rect x="504" y="48" width="156" height="150" rx="8" fill="#e3f1e8" stroke="#ccc" stroke-width="1"/><text x="582.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Apr</text><text x="582.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">cherry blossom</text><text x="582.0" y="117.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">moves north</text><text x="582.0" y="136.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Golden Week</text><rect x="668" y="48" width="156" height="150" rx="8" fill="#e3f1e8" stroke="#ccc" stroke-width="1"/><text x="746.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">May</text><text x="746.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Children’s Day (5)</text><text x="746.0" y="117.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Aoi Matsuri (15)</text><text x="746.0" y="136.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Kanda (odd years)</text><rect x="832" y="48" width="156" height="150" rx="8" fill="#fdf1d8" stroke="#ccc" stroke-width="1"/><text x="910.0" y="72.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Jun</text><text x="910.0" y="98.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Sannō (even years)</text><text x="910.0" y="117.0" text-anchor="mid