ext-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Awa Odori</text><rect x="340" y="208" width="156" height="150" rx="8" fill="#fbe7e2" stroke="#ccc" stroke-width="1"/><text x="418.0" y="232.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Sep</text><text x="418.0" y="258.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">chrysanthemum (9)</text><text x="418.0" y="277.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">harvest moon</text><text x="418.0" y="296.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">autumn higan</text><rect x="504" y="208" width="156" height="150" rx="8" fill="#fbe7e2" stroke="#ccc" stroke-width="1"/><text x="582.0" y="232.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Oct</text><text x="582.0" y="258.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">harvest moon</text><text x="582.0" y="277.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Jidai Matsuri (22)</text><text x="582.0" y="296.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">red leaves begin</text><rect x="668" y="208" width="156" height="150" rx="8" fill="#fbe7e2" stroke="#ccc" stroke-width="1"/><text x="746.0" y="232.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Nov</text><text x="746.0" y="258.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Culture Day (3)</text><text x="746.0" y="277.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">Shichi-Go-San (15)</text><text x="746.0" y="296.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">red leaves</text><rect x="832" y="208" width="156" height="150" rx="8" fill="#e4ecf7" stroke="#ccc" stroke-width="1"/><text x="910.0" y="232.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Dec</text><text x="910.0" y="258.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">red leaves</text><text x="910.0" y="277.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">winter solstice</text><text x="910.0" y="296.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">New Year’s Eve (31)</text><rect x="300" y="362" width="16" height="12" rx="2" fill="#e4ecf7" stroke="#ccc"/><text x="322.0" y="372.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">winter</text><rect x="410" y="362" width="16" height="12" rx="2" fill="#e3f1e8" stroke="#ccc"/><text x="432.0" y="372.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:400" fill="#555">spring</tex