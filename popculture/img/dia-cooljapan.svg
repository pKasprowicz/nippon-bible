<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d"><title id="t">Timeline of Cool Japan</title><desc id="d">METI’s content division (2001), McGray’s “Gross National Cool” (2002), pop culture envoys (2009), the Cool Japan office (2010), a minister for Cool Japan (2012), the Cool Japan Fund with 37.5 billion yen (2013), the Cabinet Office review (2019), overseas anime revenue overtaking domestic (2023), the New Cool Japan Strategy (2024) and its target of 20 trillion yen in overseas content revenue by 2033.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="200" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Cool Japan: from a magazine article to national strategy</text><line x1="40" y1="120" x2="960" y2="120" stroke="#bbb" stroke-width="4"/><circle cx="75" cy="120" r="7" fill="#a3385f"/><text x="75" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">2001</text><text x="75" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">METI media and</text><text x="75" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">content division</text><circle cx="169" cy="120" r="7" fill="#a3385f"/><text x="169" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">2002</text><text x="169" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe 