<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="t d"><title id="t">How to read a manga page</title><desc id="d">A page with five panels numbered in reading order: right to left along the top row, then the wide middle panel, then right to left along the bottom row. The spine is on the right; the book opens from what a Western reader calls the back.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="760" height="490" fill="#fff"/><text x="330" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Reading a manga page</text><rect x="70" y="60" width="300" height="400" rx="4" fill="#fff" stroke="#888" stroke-width="2"/><rect x="230" y="75" width="125" height="120" rx="4" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><circle cx="292.5" cy="135.0" r="22" fill="#a3385f"/><text x="292.5" y="142.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#fff">1</text><rect x="85" y="75" width="135" height="120" rx="4" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><circle cx="152.5" cy="135.0" r="22" fill="#a3385f"/><text x="152.5" y="142.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#fff">2</text><rect x="85" y="205" width="270" height="110" rx="4" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><circle cx="220.0" cy="260.0" r="22" fill="#a3385f"/><text x="220.0" y="267.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#fff">3</text><rect x="220" y="325" width="135" height="120" rx="4" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><circle cx="287.5" cy="385.0" r="22" fill="#a3385f"/><text x="287.5" y="392.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#fff">4</text><rect x="85" y="325" width="125" height="120" rx="4" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><circle cx="147.5" cy="385.0" r="22" fill="#a3385f"/><text x="147.5" y="392.0" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#fff">5</text><line x1="270" y1="135" x2="182" y2="135" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/><line x1="130" y1="180" x2="190" y2="230" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/><line x1="300" y1="290" x2="300" y2="355" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/><line x1="260" y1="385" x2="182" y2="385" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/><rect x="370" y="60" width="10" height="400" fill="#666"/><text x="388" y="260.0" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#555">spine</text><text x="560" y="120" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Panels: right to left,</text><text x="560" y="142" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">then top to bottom</text><text x="560" y="200" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">The book opens from what a</text><text x="560" y="219" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">Western reader calls the back:</text><text x="560" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">pages turn from left to right.</text><text x="560" y="300" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">Picture scrolls already unrolled</text><text x="560" y="319" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">from right to left (Chapter 1).</text><text x="560" y="380" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">Readers abroad now prefer the</text><text x="560" y="399" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#555">original “back-to-front” format.</text></svg>