<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-labelledby="t d"><title id="t">What makes an object kawaii</title><desc id="d">Four comparisons from laboratory experiments: curved shapes are more kawaii than straight ones; in-between hues such as yellow-red and red-purple more than the five basic hues; lighter, more saturated colours more than dull ones; and smaller objects, up to a point, more than large ones.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="480" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">What makes an object look kawaii: laboratory results</text><text x="420" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#555">less kawaii</text><text x="780" y="70" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">more kawaii</text><text x="120" y="140" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Shape</text><line x1="560" y1="132" x2="640" y2="132" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="380" y="102" width="60" height="60" fill="#d9d9d9" stroke="#888"/><rect x="740" y="102" width="60" height="60" rx="30" fill="#f5b7c8" stroke="#a3385f"/><text x="410" y="182" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">straight lines</text><text x="770" y="182" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">curves</text><text x="120" y="235" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Colour</text><line x1="560" y1="227" x2="640" y2="227" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="345" cy="227" r="12" fill="#d62728"/><circle cx="375" cy="227" r="12" fill="#e6c700"/><circle cx="405" cy="227" r="12" fill="#2ca02c"/><circle cx="435" cy="227" r="12" fill="#1f77b4"/><circle cx="465" cy="227" r="12" fill="#7b3fa0"/><circle cx="755" cy="227" r="16" fill="#f39c4a"/><circle cx="795" cy="227" r="16" fill="#c2457a"/><text x="410" y="277" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">the five basic hues</text><text x="770" y="277" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">in-between hues</text><text x="120" y="330" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Brightness</text><line x1="560" y1="322" x2="640" y2="322" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="410" cy="322" r="26" fill="#7a5a63"/><circle cx="770" cy="322" r="26" fill="#ff8fb4"/><text x="410" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">dull, dark</text><text x="770" y="372" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">lighter, more saturated</text><text x="120" y="425" text-anchor="start" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#222">Size</text><line x1="560" y1="417" x2="640" y2="417" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="410" cy="417" r="38" fill="#f5b7c8" opacity="0.8"/><circle cx="770" cy="417" r="18" fill="#f5b7c8"/><text x="410" y="467" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">large</text><text x="770" y="467" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">small (up to a point)</text></svg>