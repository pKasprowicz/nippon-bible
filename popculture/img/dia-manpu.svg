<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d"><title id="t">Manga marks for emotions</title><desc id="d">Four simple faces show the manga marks used on the KOBIAN robot: a bulging blood-vessel mark for anger, a tear for sadness, wrinkle marks for disgust, and a change of face colour with vertical hanging lines for fear.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="320" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Manga marks (manpu) used on the Waseda robot face</text><circle cx="130" cy="140" r="58" fill="#fff8f0" stroke="#222" stroke-width="3"/><circle cx="110" cy="134" r="5" fill="#222"/><circle cx="150" cy="134" r="5" fill="#222"/><path d="M 174.6 109.4 Q 162.1 108.1 163.4 120.6" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><path d="M 156.6 120.6 Q 157.9 108.1 145.4 109.4" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><path d="M 145.4 102.6 Q 157.9 103.9 156.6 91.4" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><path d="M 163.4 91.4 Q 162.1 103.9 174.6 102.6" fill="none" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><path d="M 100 120 l 18 6 M 160 120 l -18 6" stroke="#222" stroke-width="3"/><path d="M 112 168 q 18 -12 36 0" fill="none" stroke="#222" stroke-width="3"/><text x="130" y="232" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Anger</text><text x="130" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">a bulging blood-vessel mark</text><circle cx="377" cy="140" r="58" fill="#fff8f0" stroke="#222" stroke-width="3"/><circle cx="357" cy="134" r="5" fill="#222"/><circle cx="397" cy="134" r="5" fill="#222"/><path d="M 357 144 q -9 16 0 24 q 9 -8 0 -24 z" fill="#5dade2" stroke="#2e86c1" stroke-width="2"/><path d="M 359 174 q 18 -12 36 0" fill="none" stroke="#222" stroke-width="3" transform="rotate(180 377 170)"/><text x="377" y="232" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Sadness</text><text x="377" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">a tear mark</text><circle cx="624" cy="140" r="58" fill="#fff8f0" stroke="#222" stroke-width="3"/><circle cx="604" cy="134" r="5" fill="#222"/><circle cx="644" cy="134" r="5" fill="#222"/><path d="M 610 110 l 0 -10" stroke="#222" stroke-width="2.5"/><path d="M 617 110 l 0 -10" stroke="#222" stroke-width="2.5"/><path d="M 624 110 l 0 -10" stroke="#222" stroke-width="2.5"/><path d="M 631 110 l 0 -10" stroke="#222" stroke-width="2.5"/><path d="M 638 110 l 0 -10" stroke="#222" stroke-width="2.5"/><path d="M 606 168 l 36 4" stroke="#222" stroke-width="3"/><text x="624" y="232" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Disgust</text><text x="624" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">wrinkle marks</text><circle cx="871" cy="140" r="58" fill="#fff8f0" stroke="#222" stroke-width="3"/><circle cx="851" cy="134" r="5" fill="#222"/><circle cx="891" cy="134" r="5" fill="#222"/><rect x="823" y="84" width="96" height="40" fill="#7f9cc9" opacity="0.55"/><path d="M 835 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 847 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 859 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 871 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 883 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 895 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><path d="M 907 88 l 0 30" stroke="#2c3e70" stroke-width="2.5"/><ellipse cx="871" cy="170" rx="10" ry="7" fill="none" stroke="#222" stroke-width="3"/><text x="871" y="232" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Fear</text><text x="871" y="256" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">face colour and hanging lines</text><text x="500" y="300" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:13px;font-weight:400" fill="#555">Japanese viewers recognised the six basic emotions on the robot at over 90% on average; German viewers found the faces harder to read.</text></svg>