<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d"><title id="t">Time scaling for miniatures</title><desc id="d">A 2-metre fragment falling 40 metres takes about 3 seconds; in a 1/20 model it falls in about 0.6 seconds. Filming speed must scale with the square root of the scale: film at about 107 frames per second and project at 24, and the fall lasts about 3 seconds again.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="380" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Why a miniature must be filmed fast</text><rect x="30" y="60" width="300" height="270" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="180" y="88" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#222">Real building</text><rect x="80" y="110" width="60" height="200" fill="#ccc"/><rect x="200" y="140" width="14" height="10" fill="#777"/><line x1="207" y1="152" x2="207" y2="300" stroke="#222" stroke-width="2.5" marker-end="url(#ah)"/><text x="150" y="322" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1px;font-weight:400" fill="#222"></text><text x="260" y="200" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">2 m fragment</text><text x="260" y="219" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">falls 40 m</text><text x="260" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">in ≈ 3 s</text><rect x="350" y="60" width="300" height="270" rx="10" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="500" y="88" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#a3385f">1/20 scale model</text><rect x="420" y="250" width="16" height="60" fill="#ccc"/><rect x="470" y="256" width="5" height="4" fill="#777"/><line x1="473" y1="262" x2="473" y2="300" stroke="#a3385f" stroke-width="2.5" marker-end="url(#ah)"/><text x="560" y="200" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#a3385f">10 cm fragment</text><text x="560" y="219" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#a3385f">falls 2 m</text><text x="560" y="238" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#a3385f">in ≈ 0.6 s</text><text x="500" y="135" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">filmed at 24 frames/s:</text><text x="500" y="153" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">the audience sees a model</text><rect x="670" y="60" width="300" height="270" rx="10" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="820" y="88" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;font-weight:700" fill="#1f6f8b">The fix</text><text x="820" y="140" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:20px;font-weight:700" fill="#1f6f8b">P′ / P = √(L / L′)</text><text x="820" y="180" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">film the model at</text><text x="820" y="199" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">24 × √20 ≈ 107 frames/s,</text><text x="820" y="218" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">project at 24 frames/s:</text><text x="820" y="237" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:400" fill="#222">the fall lasts ≈ 3 s again</text><line x1="652" y1="195" x2="668" y2="195" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><text x="500" y="360" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-style:italic;font-size:13px;font-weight:400" fill="#555">Gamera 3 (Shibuya scene): explosion filmed at 240 frames/s, lights at 90, the monster at 72</text></svg>