<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490" role="img" aria-labelledby="t d"><title id="t">The production committee system</title><desc id="d">Publishers, animation studios, video, music, game and toy companies and advertising agencies invest in a production committee, a voluntary partnership that shares the copyright. It buys a broadcast slot from a TV station, orders the animation from a prime contractor studio, and earns revenue through windows for broadcasting, merchandise, overseas sales and streaming. A project needs at least 25 million yen per episode and 300 million yen in total.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="490" fill="#fff"/><text x="500.0" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">How a TV anime series is financed: the production committee</text><rect x="22" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="86" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">publisher</text><line x1="86" y1="102" x2="355.1" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="160" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="224" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">animation studio</text><line x1="224" y1="102" x2="403.4" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="298" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="362" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">video company</text><line x1="362" y1="102" x2="451.7" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="436" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="500" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">music company</text><line x1="500" y1="102" x2="500.0" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="574" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="638" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">game company</text><line x1="638" y1="102" x2="548.3" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="712" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="776" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">toy company</text><line x1="776" y1="102" x2="596.6" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="850" y="56" width="128" height="44" rx="8" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="914" y="84" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:600" fill="#222">ad agency</text><line x1="914" y1="102" x2="644.9" y2="146" stroke="#a3385f" stroke-width="2" marker-end="url(#ah)"/><rect x="452" y="112" width="96" height="18" fill="#fff"/><text x="500.0" y="126" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#a3385f">invest money</text><rect x="250" y="150" width="500" height="92" rx="12" fill="#f8e6ee" stroke="#a3385f" stroke-width="2"/><text x="500" y="180" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:700" fill="#a3385f">Production committee (seisaku iinkai)</text><text x="500" y="204" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">a voluntary partnership (Civil Code art. 668): shares the copyright,</text><text x="500" y="221" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:400" fill="#555">divides revenue by each member’s share of the investment</text><line x1="260" y1="245" x2="140" y2="300" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="300" width="230" height="96" rx="10" fill="#e3f1f6" stroke="#1f6f8b" stroke-width="2"/><text x="145" y="326" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#1f6f8b">TV station</text><text x="145" y="350" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">the committee buys the</text><text x="145" y="366" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">broadcast slot: no income</text><line x1="500" y1="245" x2="500" y2="300" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="300" width="340" height="96" rx="10" fill="#fff" stroke="#222" stroke-width="2"/><text x="500" y="326" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#222">Prime contractor (animation studio)</text><text x="500" y="350" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">receives the production order; works with</text><text x="500" y="366" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">specialist companies and freelancers</text><line x1="700" y1="245" x2="800" y2="300" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/><rect x="740" y="300" width="230" height="96" rx="10" fill="#fff" stroke="#a3385f" stroke-width="2"/><text x="855" y="326" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;font-weight:700" fill="#a3385f">“Windows” (madoguchi)</text><text x="855" y="350" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">broadcasting, merchandise,</text><text x="855" y="366" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#555">overseas sales, streaming</text><path d="M 972 340 C 1000 260, 900 196, 754 196" fill="none" stroke="#a3385f" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="870" y="282" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px;font-weight:600" fill="#a3385f">revenue flows back</text><rect x="330" y="420" width="340" height="54" rx="8" fill="#fffaf0" stroke="#c9a227" stroke-width="2"/><text x="500" y="442" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">≥ ¥25 million per episode · ≥ ¥300 million per project</text><text x="500" y="459" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:12.5px;font-weight:400" fill="#222">quality risk falls on the studio</text></svg>