<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-labelledby="t d"><title id="t">Timeline of Japanese pop culture</title><desc id="d">From the twelfth-century Chōjū-giga scrolls and Hokusai manga (1814) through the first Japanese animation (1917), Rashomon’s Golden Lion (1951), Godzilla (1954), weekly boys’ manga magazines (1959), Astro Boy (1963), the first Comic Market (1975) and the Famicom (1983), to “Gross National Cool” (2002), Hatsune Miku (2007) and an anime market 56.5 per cent overseas (2024).</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="1000" height="200" fill="#fff"/><text x="500" y="32" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:19px;font-weight:700" fill="#222">Pop culture in Japan: a timeline of this handbook</text><line x1="30" y1="120" x2="970" y2="120" stroke="#bbb" stroke-width="4"/><circle cx="62" cy="120" r="7" fill="#a3385f"/><text x="62" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">12th c.</text><text x="62" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Chōjū-giga</text><text x="62" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">animal scrolls</text><circle cx="142" cy="120" r="7" fill="#a3385f"/><text x="142" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1814</text><text x="142" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Hokusai manga</text><text x="142" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">vol. 1</text><circle cx="222" cy="120" r="7" fill="#a3385f"/><text x="222" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1917</text><text x="222" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">first Japanese</text><text x="222" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">animation</text><circle cx="302" cy="120" r="7" fill="#a3385f"/><text x="302" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1951</text><text x="302" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Rashomon:</text><text x="302" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Golden Lion</text><circle cx="382" cy="120" r="7" fill="#a3385f"/><text x="382" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1954</text><text x="382" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Godzilla</text><text x="382" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555"></text><circle cx="462" cy="120" r="7" fill="#a3385f"/><text x="462" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1959</text><text x="462" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">weekly boys’</text><text x="462" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">manga magazines</text><circle cx="542" cy="120" r="7" fill="#a3385f"/><text x="542" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1963</text><text x="542" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Astro Boy</text><text x="542" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">on TV</text><circle cx="622" cy="120" r="7" fill="#a3385f"/><text x="622" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1975</text><text x="622" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">first</text><text x="622" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Comic Market</text><circle cx="702" cy="120" r="7" fill="#a3385f"/><text x="702" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#a3385f">1983</text><text x="702" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Famicom</text><text x="702" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555"></text><circle cx="782" cy="120" r="7" fill="#1f6f8b"/><text x="782" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#1f6f8b">2002</text><text x="782" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">“Gross National</text><text x="782" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Cool”</text><circle cx="862" cy="120" r="7" fill="#1f6f8b"/><text x="862" y="98" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#1f6f8b">2007</text><text x="862" y="58" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">Hatsune Miku</text><text x="862" y="72" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555"></text><circle cx="942" cy="120" r="7" fill="#1f6f8b"/><text x="942" y="150" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;font-weight:700" fill="#1f6f8b">2024</text><text x="942" y="172" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">overseas: 56.5%</text><text x="942" y="186" text-anchor="middle" style="font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:400" fill="#555">of anime market</text></svg>